<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyanPlay 24/7 Game Top-Up Store</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f172a; color: #f8fafc; padding: 10px; }
        .nav { background: #1e293b; padding: 12px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; margin-bottom: 15px; }
        .nav-title { font-size: 18px; font-weight: bold; color: #818cf8; }
        .btn { background: #4f46e5; color: white; border: none; padding: 8px 14px; border-radius: 6px; font-weight: bold; cursor: pointer; }
        .btn-green { background: #059669; }
        .card { background: #1e293b; padding: 15px; border-radius: 12px; border: 1px solid #334155; margin-bottom: 15px; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .game-btn { background: #0f172a; border: 2px solid #334155; padding: 12px; border-radius: 10px; color: white; text-align: center; cursor: pointer; }
        .game-btn.active { border-color: #6366f1; background: #1e1b4b; }
        input, select { width: 100%; padding: 10px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 6px; margin-top: 5px; margin-bottom: 10px; }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; align-items: center; justify-content: center; padding: 15px; }
        .modal-content { background: #1e293b; padding: 20px; border-radius: 12px; width: 100%; max-width: 400px; position: relative; }
        .close-btn { position: absolute; top: 10px; right: 15px; font-size: 20px; color: #94a3b8; cursor: pointer; }
    </style>
</head>
<body>

    <div class="nav">
        <div class="nav-title">🎮 MyanPlay TopUp</div>
        <div>
            <span id="user-logged-in" style="display:none;">
                <span id="display-user-name" style="font-size:12px; color:#94a3b8;"></span>
                <span id="display-wallet-balance" style="color:#34d399; font-weight:bold; font-size:12px;">0</span> Ks
                <button class="btn btn-green" onclick="openDepositModal()">ငွေဖြည့်</button>
            </span>
            <span id="user-logged-out">
                <button class="btn" onclick="openAuthModal('login')">Login</button>
                <button class="btn" onclick="openAuthModal('register')">Register</button>
            </span>
        </div>
    </div>

    <!-- Game Choice -->
    <div class="card">
        <h3 style="margin-bottom:10px; font-size:14px; color:#cbd5e1;">🎮 ဂိမ်း အမျိုးအစား ရွေးချယ်ပါ</h3>
        <div class="grid-2">
            <div id="btn-mlbb" class="game-btn active" onclick="selectGame('MLBB')">
                <div style="font-size:20px;">🛡️</div>
                <b>Mobile Legends</b>
            </div>
            <div id="btn-pubg" class="game-btn" onclick="selectGame('PUBG')">
                <div style="font-size:20px;">🎯</div>
                <b>PUBG Mobile</b>
            </div>
        </div>
    </div>

    <!-- Account Details -->
    <div class="card">
        <h3 style="margin-bottom:10px; font-size:14px; color:#cbd5e1;">👤 ဂိမ်း အကောင့်အချက်အလက် ထည့်ပါ</h3>
        <label style="font-size:12px; color:#94a3b8;">Player ID</label>
        <input type="text" id="input-player-id" placeholder="12345678">
        
        <div id="container-zone-id">
            <label style="font-size:12px; color:#94a3b8;">Zone ID (Server ID)</label>
            <input type="text" id="input-zone-id" placeholder="1234">
        </div>

        <button class="btn" style="width:100%;" onclick="verifyPlayerName()">✓ အမည် စစ်ဆေးမည်</button>
        <div id="player-name-display" style="display:none; margin-top:10px; background:#1e1b4b; padding:8px; border-radius:6px; font-size:12px; color:#a5b4fc;">
            အကောင့်အမည်: <b id="verified-name" style="color:white;"></b>
        </div>
    </div>

    <!-- Package Grid -->
    <div class="card">
        <h3 style="margin-bottom:10px; font-size:14px; color:#cbd5e1;">💎 Package ရွေးချယ်ပါ</h3>
        <div id="packages-grid" class="grid-2"></div>
    </div>

    <!-- Checkout -->
    <div id="section-checkout" class="card" style="display:none;">
        <h3 style="margin-bottom:10px; font-size:14px; color:#818cf8;">💳 ငွေပေးချေမှု နည်းလမ်း</h3>
        <button class="btn" style="width:100%; margin-bottom:10px; background:#059669;" onclick="setPaymentType('WALLET')">App Wallet လက်ကျန်ငွေဖြင့် ပေးချေမည် (<span id="checkout-wallet-bal">0</span> Ks)</button>
        <button class="btn" style="width:100%; background:#334155;" onclick="setPaymentType('DIRECT')">KBZPay / WavePay ဖြင့် လွှဲမည်</button>

        <div id="form-direct-payment" style="display:none; margin-top:10px;">
            <p style="font-size:12px; color:#818cf8; margin-bottom:5px;">💳 ငွေလွှဲရန်: 09449490500</p>
            <input type="text" id="direct-txn-id" placeholder="Transaction ID (အနောက်ဆုံး ၆ လုံး)">
            <input type="file" id="direct-file-screenshot" accept="image/*">
        </div>

        <button class="btn btn-green" style="width:100%; margin-top:15px; padding:12px;" onclick="submitOrder()">အော်ဒါ အတည်ပြုမည်</button>
    </div>

    <!-- Auth Modal -->
    <div id="modal-auth" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-auth')">✕</span>
            <h3 id="auth-title" style="color:#818cf8; margin-bottom:15px;">အကောင့်ဝင်ပါ</h3>
            <div id="field-name" style="display:none;">
                <label style="font-size:12px; color:#94a3b8;">အမည်</label>
                <input type="text" id="auth-input-name" placeholder="မောင်မောင်">
            </div>
            <label style="font-size:12px; color:#94a3b8;">ဖုန်းနံပါတ်</label>
            <input type="text" id="auth-input-phone" placeholder="09449490500">
            <label style="font-size:12px; color:#94a3b8;">စကားဝှက်</label>
            <input type="password" id="auth-input-pass" placeholder="******">
            <button class="btn" style="width:100%; margin-top:10px;" onclick="submitAuth()">အတည်ပြုမည်</button>
        </div>
    </div>

    <!-- Deposit Modal -->
    <div id="modal-deposit" class="modal">
        <div class="modal-content">
            <span class="close-btn" onclick="closeModal('modal-deposit')">✕</span>
            <h3 style="color:#34d399; margin-bottom:10px;">App Wallet ငွေဖြည့်မည်</h3>
            <p style="font-size:12px; color:#818cf8; margin-bottom:10px;">💳 ငွေလွှဲရန်: 09449490500 (KBZPay/WavePay)</p>
            <input type="number" id="dep-amount" placeholder="ငွေဖြည့်မည့် ပမာဏ (ကျပ်)">
            <select id="dep-method">
                <option value="KBZPay">KBZPay</option>
                <option value="WavePay">WavePay</option>
            </select>
            <input type="text" id="dep-txn-id" placeholder="Transaction ID">
            <input type="file" id="dep-file" accept="image/*">
            <button class="btn btn-green" style="width:100%; margin-top:10px;" onclick="submitDeposit()">ငွေဖြည့်မှု တောင်းဆိုမည်</button>
        </div>
    </div>

    <script>
        let currentUser = JSON.parse(localStorage.getItem('myanplay_user') || 'null');
        let selectedGame = 'MLBB';
        let selectedPackage = null;
        let paymentType = 'WALLET';
        let authMode = 'login';

        const packagesData = [
            { id: 'ml_weekly', game_type: 'MLBB', name: 'Weekly Diamond Pass', price_mmk: 6600 },
            { id: 'ml_86', game_type: 'MLBB', name: '86 Diamonds', price_mmk: 5600 },
            { id: 'ml_172', game_type: 'MLBB', name: '172 Diamonds', price_mmk: 10800 },
            { id: 'ml_257', game_type: 'MLBB', name: '257 Diamonds', price_mmk: 16800 },
            { id: 'pubg_60', game_type: 'PUBG', name: '60 UC', price_mmk: 4300 },
            { id: 'pubg_325', game_type: 'PUBG', name: '325 UC', price_mmk: 22000 },
            { id: 'pubg_660', game_type: 'PUBG', name: '660 UC', price_mmk: 43500 },
        ];

        function initApp() {
            updateUserUI();
            renderPackages();
        }

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('user-logged-in').style.display = 'inline';
                document.getElementById('user-logged-out').style.display = 'none';
                document.getElementById('display-user-name').innerText = currentUser.name;
                document.getElementById('display-wallet-balance').innerText = (currentUser.wallet_balance || 0).toLocaleString();
                document.getElementById('checkout-wallet-bal').innerText = (currentUser.wallet_balance || 0).toLocaleString();
            } else {
                document.getElementById('user-logged-in').style.display = 'none';
                document.getElementById('user-logged-out').style.display = 'inline';
            }
        }

        function openAuthModal(mode) {
            authMode = mode;
            document.getElementById('modal-auth').style.display = 'flex';
            document.getElementById('auth-title').innerText = mode === 'login' ? 'အကောင့်ဝင်ပါ' : 'အကောင့်သစ်ဖွင့်ပါ';
            document.getElementById('field-name').style.display = mode === 'register' ? 'block' : 'none';
        }

        async function submitAuth() {
            const phone = document.getElementById('auth-input-phone').value.trim();
            const pass = document.getElementById('auth-input-pass').value.trim();
            const name = document.getElementById('auth-input-name').value.trim();

            const url = authMode === 'login' ? '/api/login' : '/api/register';
            const body = authMode === 'login' ? { phone, password: pass } : { phone, password: pass, name };

            try {
                const res = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                if (data.success) {
                    currentUser = data.user;
                    localStorage.setItem('myanplay_user', JSON.stringify(currentUser));
                    updateUserUI();
                    closeModal('modal-auth');
                    alert(data.message);
                } else {
                    alert('⚠️ ' + data.detail);
                }
            } catch (err) {
                alert('Server ချိတ်ဆက်၍ မရပါ');
            }
        }

        function logout() {
            currentUser = null;
            localStorage.removeItem('myanplay_user');
            updateUserUI();
        }

        function openDepositModal() {
            if (!currentUser) return openAuthModal('login');
            document.getElementById('modal-deposit').style.display = 'flex';
        }

        async function submitDeposit() {
            const amount = document.getElementById('dep-amount').value;
            const method = document.getElementById('dep-method').value;
            const txnId = document.getElementById('dep-txn-id').value.trim();
            const fileInput = document.getElementById('dep-file');

            if (!amount || !txnId || !fileInput.files[0]) {
                alert('အချက်အလက်များနှင့် Screenshot ပြေစာ တင်ပေးပါ');
                return;
            }

            const formData = new FormData();
            formData.append('user_id', currentUser.id);
            formData.append('amount', amount);
            formData.append('payment_method', method);
            formData.append('transaction_id', txnId);
            formData.append('screenshot', fileInput.files[0]);

            try {
                const res = await fetch('/api/deposits', { method: 'POST', body: formData });
                const data = await res.json();
                if (data.success) {
                    alert('✅ ' + data.message);
                    closeModal('modal-deposit');
                } else {
                    alert('⚠️ ' + data.detail);
                }
            } catch (err) {
                alert('ငွေဖြည့်သွင်း၍ မရပါ');
            }
        }

        function selectGame(game) {
            selectedGame = game;
            selectedPackage = null;
            document.getElementById('section-checkout').style.display = 'none';
            document.getElementById('btn-mlbb').className = `game-btn ${game === 'MLBB' ? 'active' : ''}`;
            document.getElementById('btn-pubg').className = `game-btn ${game === 'PUBG' ? 'active' : ''}`;
            document.getElementById('container-zone-id').style.display = game === 'MLBB' ? 'block' : 'none';
            renderPackages();
        }

        function render

<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyanPlay 24/7 Game Top-Up Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap');
        body { font-family: 'Padauk', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <!-- Header Navigation -->
    <nav class="bg-slate-800 border-b border-slate-700 sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="switchTab('store')">
                <div class="w-10 h-10 bg-indigo-600 rounded-lg flex items-center justify-center font-bold text-xl text-white">
                    🎮
                </div>
                <div>
                    <h1 class="text-xl font-bold text-indigo-400">MyanPlay TopUp</h1>
                    <p class="text-xs text-slate-400">၂၄ နာရီ ဂိမ်းစိန်နှင့် Wallet ငွေဖြည့်စနစ်</p>
                </div>
            </div>

            <div class="flex items-center space-x-2">
                <div id="user-logged-in" style="display: none;" class="flex items-center space-x-2">
                    <div class="text-right">
                        <div class="text-xs text-slate-400" id="display-user-name">User</div>
                        <div class="text-xs font-bold text-emerald-400"><span id="display-wallet-balance">0</span> Ks</div>
                    </div>
                    <button onclick="openDepositModal()" class="bg-emerald-600 hover:bg-emerald-500 px-2.5 py-1 rounded text-xs font-bold">
                        ငွေဖြည့်
                    </button>
                    <button onclick="logout()" class="bg-red-900/50 text-red-300 px-2 py-1 rounded text-xs">
                        ထွက်မည်
                    </button>
                </div>

                <div id="user-logged-out" class="flex space-x-2">
                    <button onclick="openAuthModal('login')" class="bg-slate-700 hover:bg-slate-600 px-3 py-1.5 rounded-lg text-xs font-bold text-indigo-300">
                        Login
                    </button>
                    <button onclick="openAuthModal('register')" class="bg-indigo-600 hover:bg-indigo-500 px-3 py-1.5 rounded-lg text-xs font-bold text-white">
                        Register
                    </button>
                </div>

                <button id="btn-admin-panel" style="display: none;" onclick="openAdminModal()" class="bg-purple-700 hover:bg-purple-600 px-2.5 py-1.5 rounded-lg text-xs font-bold">
                    Admin
                </button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">

        <!-- Game Selector -->
        <div>
            <h2 class="text-base font-semibold text-slate-300 mb-3">🎮 ဂိမ်း အမျိုးအစား ရွေးချယ်ပါ</h2>
            <div class="grid grid-cols-2 gap-4">
                <button id="btn-mlbb" onclick="selectGame('MLBB')" class="bg-slate-800 border-2 border-indigo-500 p-4 rounded-xl flex flex-col items-center justify-center">
                    <span class="text-2xl mb-1">🛡️</span>
                    <span class="font-bold text-white text-sm">Mobile Legends</span>
                    <span class="text-xs text-indigo-400">Smile.one Direct</span>
                </button>
                <button id="btn-pubg" onclick="selectGame('PUBG')" class="bg-slate-800 border-2 border-transparent p-4 rounded-xl flex flex-col items-center justify-center">
                    <span class="text-2xl mb-1">🎯</span>
                    <span class="font-bold text-white text-sm">PUBG Mobile</span>
                    <span class="text-xs text-indigo-400">Codashop Direct</span>
                </button>
            </div>
        </div>

        <!-- Player Info Input -->
        <div class="bg-slate-800 p-5 rounded-2xl border border-slate-700 space-y-4">
            <h2 class="text-base font-semibold text-slate-300">👤 ဂိမ်း အကောင့်အချက်အလက် ထည့်ပါ</h2>
            <div class="space-y-3
